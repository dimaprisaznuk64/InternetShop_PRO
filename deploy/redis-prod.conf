# Redis Production Configuration — InternetShop PRO

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Persistence (AOF for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-size 64mb

# Logging
loglevel notice
logfile ""

# Security
protected-mode yes
requirepass ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Eviction
maxmemory-samples 5
