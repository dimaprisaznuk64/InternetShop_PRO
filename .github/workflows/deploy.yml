name: Deploy

# Template for a real VPS. Runs MANUALLY until SERVER_* secrets exist
# (repo Settings -> Environments -> production). To re-enable auto-deploy
# after CI, add back:
#   workflow_run:
#     workflows: ["CI"]
#     types: [completed]
#     branches: [master]
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/internetshop
            git pull origin master
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend \
              alembic upgrade head
            docker system prune -f

      - name: Health check
        run: |
          sleep 15
          curl -sf ${{ secrets.HEALTH_CHECK_URL }} || exit 1
