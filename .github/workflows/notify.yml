name: Notify

# Telegram deploy notification. MANUAL for now: needs TELEGRAM_CHAT_ID /
# TELEGRAM_BOT_TOKEN repo secrets and a real Deploy run to report on.
on:
  workflow_dispatch:

jobs:
  telegram:
    name: Telegram Notification
    runs-on: ubuntu-latest
    steps:
      - name: Send status
        continue-on-error: true
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Deploy ${{ github.event.workflow_run.conclusion }}
            Branch: master
            Commit: ${{ github.event.workflow_run.head_commit.message }}
            Time: ${{ github.event.workflow_run.updated_at }}
